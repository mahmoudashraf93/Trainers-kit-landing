<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign seo_title = page.title | default: site.title %}
  {% assign seo_description = page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 %}
  <title>{% if page.title %}{{ seo_title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ seo_description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ seo_title | escape }} | {{ site.title | escape }}">
  <meta property="og:description" content="{{ seo_description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/site/app-icon.png' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="apple-itunes-app" content="app-id=6446181545">
  <link rel="icon" href="{{ '/assets/site/app-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site/style.css' | relative_url }}">
</head>
